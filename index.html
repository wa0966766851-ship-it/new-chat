<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>賽爾號對戰模擬器</title>
    <!-- D-13：外部字型非阻塞載入；離線或被擋時退回系統字型，不影響渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Runic&family=Noto+Sans+Symbols&family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;600;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Runic&family=Noto+Sans+Symbols&family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;600;900&display=swap" /></noscript>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA：加到主畫面即可像 App 一樣全螢幕執行 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0C10" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="6V6 精靈對戰模擬器：自訂陣容、AI 對戰、命運之輪與星際探索。" />

    <!-- iOS：Safari 不讀 manifest，需要這些 apple 專屬標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="賽爾模擬器" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Android：可安裝的體驗 -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
