name: Diagnose audit snapshot consistency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit:implementation
      - name: Check tracked snapshot
        run: git diff --exit-code -- docs/全精靈效果實裝核對.json docs/全精靈效果實裝核對.md docs/audits/elves
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-platform-snapshot
          path: |
            docs/全精靈效果實裝核對.json
            docs/全精靈效果實裝核對.md
            docs/audits/elves
          retention-days: 3
