appId: com.seer.battle.simulator
productName: 賽爾對戰模擬器
artifactName: 賽爾對戰模擬器-${version}-${os}-${arch}.${ext}
asar: true
files:
  - electron/**/*
  - package.json
extraResources:
  - from: dist
    to: dist
  - from: images
    to: images
  - from: public
    to: public
  - from: 系
    to: 系
  - from: pet
    to: pet
  - from: .seer-cache
    to: .seer-cache
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: 賽爾對戰模擬器-${version}-portable.exe
