appId: com.seer.battle.simulator
productName: 賽爾對戰模擬器
artifactName: 賽爾對戰模擬器-${version}-${os}-${arch}.${ext}
directories:
  app: build/electron-app
  output: dist-electron
asar: true
compression: maximum
beforeBuild: electron/beforeBuild.cjs
files:
  - electron/**/*
  - package.json
extraResources:
  - from: dist
    to: dist
    filter:
      - "!win-unpacked"
      - "!builder-effective-config.yaml"
  - from: images
    to: images
  - from: public
    to: public
  - from: 系
    to: 系
  - from: pet
    to: pet
win:
  signAndEditExecutable: false
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: 賽爾對戰模擬器-${version}-portable.exe
