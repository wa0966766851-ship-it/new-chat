appId: com.seer.battle.simulator
productName: 賽爾對戰模擬器
artifactName: 賽爾對戰模擬器-${version}-${os}-${arch}.${ext}
directories:
  app: build/electron-app
  output: dist-electron
asar: true
compression: maximum
beforeBuild: electron/beforeBuild.cjs
afterPack: electron/afterPack.cjs
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
publish:
  provider: github
  owner: wa0966766851-ship-it
  repo: new-chat
files:
  - electron/**/*
  - package.json
extraResources:
  - from: dist
    to: dist
    filter:
      - "!win-unpacked"
      - "!builder-effective-config.yaml"
  - from: images
    to: images
  - from: public
    to: public
  - from: 系
    to: 系
  - from: pet
    to: pet
win:
  icon: electron/assets/holy-puni.ico
  signAndEditExecutable: true
  signExecutable: false
  target:
    - nsis
    - portable
    - nsis-web
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: 賽爾對戰模擬器-${version}-portable.exe
nsisWeb:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: 賽爾對戰模擬器-${version}-web-setup.exe
